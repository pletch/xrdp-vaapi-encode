# xrdp: sway for Wayland RemoteApp sessions (SCP_SESSION_TYPE_WAYLAND_REMOTEAPP).
#
# The client's desktop is the desktop: each application window appears on
# it as a window of its own. chansrv manages the windows over sway's IPC,
# so every window floats, undecorated, where chansrv puts it, and there is
# no bar, wallpaper or key binding here to get in the way.
#
# startwayland.sh starts sway with a configuration that includes this file
# and runs waylandsession.sh.

default_border none
default_floating_border none
for_window [all] floating enable, border none
focus_follows_mouse no
focus_on_window_activation focus
output * bg #000000 solid_color
xwayland enable
